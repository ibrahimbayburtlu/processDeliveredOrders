spring:
  application:
    name: startupheroes

  logging:
    level:
      org.springframework.cache: TRACE
      org.springframework.data.redis.cache: DEBUG

  datasource:
    url: jdbc:mysql://localhost:3306/startupheroes?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: startupheroes
    password: startupheroes
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  sql:
    init:
      mode: always
      schema-locations: classpath:init.sql
    jpa:
      defer-datasource-initialization: true

  # ✅ Redis (Cache) configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "startupheroes::"

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring:
          json:
            trusted:
              packages: com.startupheroes.startupheroes.model
    consumer:
      group-id: order-delivery-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: com.startupheroes.startupheroes.model

server:
  port: 8081
